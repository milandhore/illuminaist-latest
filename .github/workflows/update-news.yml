name: Update daily AI news

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run news:update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit refreshed briefing
        run: |
          git config user.name "IlluminAIst News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/news.js public/articles/news
          git diff --cached --quiet || git commit -m "chore: refresh daily AI news"
          git push
