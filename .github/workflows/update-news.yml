name: Refresh news and deploy GitHub Pages

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run news:update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Validate
        run: npm test

      - name: Build site
        run: npm run build

      - name: Commit refreshed briefing and alerts
        run: |
          git config user.name "IlluminAIst News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/news.js src/data/alerts.json public/alerts.json public/articles/news
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore: refresh daily AI news"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
