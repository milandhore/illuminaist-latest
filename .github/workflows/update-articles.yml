name: Update Article Library

on:
  schedule:
    # Run daily at 03:30 UTC.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-content-publishing
  cancel-in-progress: false

jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Gemini configuration when available
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured; article publication will be skipped."
          else
            node tools/list-models.cjs
          fi

      - name: Generate latest article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tools/update-articles.cjs

      - name: Commit and push article changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/articles.js public/articles/
          if git diff --staged --quiet; then
            echo "No article changes to commit."
          else
            git commit -m "Auto-publish AI engineering article"
            git push
          fi
